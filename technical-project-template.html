<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Project — AgrabanArt</title>
  <!-- COMMENT: favicon — add favicon.png (or .ico) to the site root, then this picks it up automatically -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
    }
    .tech-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 0.4rem 0.85rem;
      border-radius: 2px;
    }
    .detail-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="brand">AGRABAN<span>ART</span></a>
    <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="technical.html" class="is-active">Technical Projects</a></li>
      <li><a href="commission.html">Commission</a></li>
      <li><a href="events.html">Events &amp; Achievements</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="detail-hero">
    <p class="eyebrow reveal" id="detail-category">Loading&hellip;</p>
    <h1 class="reveal" id="detail-title" style="font-family: var(--font-display); font-size: clamp(2.5rem, 7vw, 4.5rem); margin: 0.5rem 0 0;"></h1>
    <div class="tech-tags reveal" id="detail-tech-tags"></div>
  </header>

  <div class="wrap">
    <div class="detail-media reveal" id="detail-media">
      Loading project&hellip;
    </div>

    <div class="detail-body reveal">
      <h2>About this project</h2>
      <p id="detail-description"></p>

      <div class="detail-links" id="detail-links"></div>

      <a href="technical.html" class="back-link">&larr; Back to Technical Projects</a>
    </div>
  </div>

  <footer class="site-footer">
    <span class="brand" style="display:inline-block;">AGRABAN<span style="color: var(--gold);">ART</span></span>
    <p>&copy; <span id="year"></span> Mohamad Raziqaiman Bin Mohd Yazid. All artwork rights reserved.</p>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const categoryLabels = { web: 'Web Development', infra: 'Systems & Infrastructure', software: 'Software Development' };

      if (!id) {
        document.getElementById('detail-title').textContent = 'No project selected';
        document.getElementById('detail-media').textContent = 'Go back to Technical Projects and click a piece to view it here.';
        return;
      }

      const client = window.supabase.createClient(AGRABAN_CONFIG.SUPABASE_URL, AGRABAN_CONFIG.SUPABASE_ANON_KEY);
      const { data, error } = await client.from('technical_projects').select('*').eq('id', id).single();

      if (error || !data) {
        document.getElementById('detail-title').textContent = 'Project not found';
        document.getElementById('detail-media').textContent = 'This project may have been removed.';
        return;
      }

      document.getElementById('detail-category').textContent = categoryLabels[data.category] || data.category;
      document.getElementById('detail-title').textContent = data.title;
      document.getElementById('detail-description').textContent = data.description;

      // Tech stack tags — comma-separated free text
      if (data.tech_stack) {
        const tagsWrap = document.getElementById('detail-tech-tags');
        data.tech_stack.split(',').map((t) => t.trim()).filter(Boolean).forEach((tag) => {
          const span = document.createElement('span');
          span.className = 'tech-tag';
          span.textContent = tag;
          tagsWrap.appendChild(span);
        });
      }

      const mediaEl = document.getElementById('detail-media');
      if (data.image_key) {
        mediaEl.textContent = '';
        mediaEl.style.padding = '0';
        const img = document.createElement('img');
        img.src = `${AGRABAN_CONFIG.MEDIA_PUBLIC_BASE_URL}/${data.image_key}`;
        img.alt = data.title;
        img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
        mediaEl.appendChild(img);
      } else {
        mediaEl.textContent = 'No media uploaded for this project yet.';
      }

      // Live site / GitHub links
      const linksWrap = document.getElementById('detail-links');
      if (data.live_url) {
        const a = document.createElement('a');
        a.href = data.live_url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'btn';
        a.textContent = 'View Live';
        linksWrap.appendChild(a);
      }
      if (data.github_url) {
        const a = document.createElement('a');
        a.href = data.github_url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'btn btn-quiet';
        a.textContent = 'View on GitHub';
        linksWrap.appendChild(a);
      }
    })();
  </script>
</body>
</html>
