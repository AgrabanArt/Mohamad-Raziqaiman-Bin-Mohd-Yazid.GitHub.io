<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Manager — TMB Studio</title>
<link rel="stylesheet" href="./style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body {
    overflow-x: hidden;
    scroll-snap-type: none;
    height: auto;
  }

  /* ---------- Login screen ---------- */
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--border-dim);
    background: rgba(255,255,255,0.02);
    padding: 2.5rem;
  }
  .login-card h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--pure-white);
    margin-bottom: 0.5rem;
  }
  .login-card p { color: var(--grey-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
  .login-card input {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.7rem 0.9rem;
    margin-bottom: 1rem;
  }
  .login-card input:focus { outline: none; border-color: var(--border-glow); }
  .login-error { color: #e08a8a; font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2em; }

  /* ---------- CMS shell (sidebar layout) ---------- */
  .cms-app { display: none; }
  .cms-app.ready { display: flex; min-height: 100vh; }

  .cms-sidebar {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-dim);
    padding: 2rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .cms-sidebar-brand {
    font-family: var(--font-display);
    font-size: 1.15rem;
    color: var(--pure-white);
    letter-spacing: 0.04em;
    margin-bottom: 2rem;
    padding: 0 0.5rem;
  }
  .cms-nav-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--font-heading);
    font-size: 0.78rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--grey-muted);
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .cms-nav-item:hover { color: var(--white-dim); background: rgba(255,255,255,0.03); }
  .cms-nav-item.active {
    color: var(--pure-white);
    border-left-color: var(--border-glow);
    background: rgba(255,255,255,0.05);
  }
  .cms-sidebar-footer {
    margin-top: auto;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-dim);
  }
  .cms-sidebar-footer .cms-btn { width: 100%; }
  .cms-user-email {
    font-size: 0.72rem;
    color: var(--grey-muted);
    padding: 0 0.5rem 0.75rem;
    word-break: break-all;
  }

  .cms-main {
    flex: 1;
    min-width: 0;
    padding: 3rem 3rem 6rem;
  }
  .cms-page { display: none; max-width: 780px; }
  .cms-page.active { display: block; }
  .cms-page-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-dim); }
  .cms-page-header h1 {
    font-family: var(--font-display);
    font-size: 1.9rem;
    color: var(--pure-white);
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
  }
  .cms-page-header p { color: var(--grey-muted); font-size: 0.95rem; }

  .cms-btn {
    font-family: var(--font-heading);
    font-size: 0.72rem;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border-dim);
    background: transparent;
    color: var(--white-dim);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .cms-btn:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.06); }
  .cms-btn.primary { background: var(--white); color: var(--black); border-color: var(--white); }
  .cms-btn.primary:hover { background: transparent; color: var(--white); }
  .cms-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .cms-btn:disabled:hover { background: transparent; border-color: var(--border-dim); }

  .cms-status {
    font-family: var(--font-heading);
    font-size: 0.68rem;
    letter-spacing: 0.1rem;
    color: var(--grey-muted);
    min-height: 1.2em;
  }
  .cms-status.saved { color: #8aff8a; }
  .cms-status.error { color: #e08a8a; }

  .cms-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin: -3rem -3rem 2rem;
    padding: 1.25rem 3rem;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 10, 10, 0.97);
    border-bottom: 1px solid var(--border-dim);
  }
  .cms-toolbar-actions { display: flex; gap: 0.6rem; align-items: center; }

  .cms-field {
    border: 1px solid var(--border-dim);
    background: rgba(255,255,255,0.015);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .cms-field label {
    display: block;
    font-family: var(--font-heading);
    font-size: 0.7rem;
    letter-spacing: 0.12rem;
    text-transform: uppercase;
    color: var(--grey-light);
    margin-bottom: 0.75rem;
  }
  .cms-field input[type="text"],
  .cms-field textarea {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.65rem 0.85rem;
    resize: vertical;
  }
  .cms-field input[type="text"]:focus,
  .cms-field textarea:focus { outline: none; border-color: var(--border-glow); }
  .cms-field textarea { min-height: 90px; }

  .cms-media-row { display: flex; gap: 1.25rem; align-items: flex-start; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .cms-preview {
    width: 200px;
    height: 112.5px; /* 16:9 */
    background: var(--grey-mid);
    border: 1px solid var(--border-dim);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cms-preview img, .cms-preview video { width: 100%; height: 100%; object-fit: cover; }
  .cms-preview.empty {
    color: var(--grey-muted);
    font-family: var(--font-heading);
    font-size: 0.65rem;
    letter-spacing: 0.1rem;
    text-align: center;
    padding: 0.5rem;
  }
  .cms-media-controls { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 0.5rem; }
  .cms-media-btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .cms-upload-label {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-family: var(--font-heading);
    font-size: 0.68rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--white-dim);
    border: 1px solid var(--border-dim);
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .cms-upload-label:hover { border-color: var(--border-glow); }
  .cms-upload-label.danger { color: #e08a8a; }
  .cms-upload-label.danger:hover { border-color: #e08a8a; }
  .cms-hint { font-size: 0.78rem; color: var(--grey-muted); line-height: 1.5; }
  .cms-hint.warn { color: #d9a05b; }
  .cms-hint.error { color: #e08a8a; }

  .cms-notice {
    border-left: 2px solid var(--border-glow);
    background: rgba(255,255,255,0.03);
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    color: var(--grey-muted);
    font-size: 0.92rem;
    line-height: 1.7;
  }
  .cms-notice strong { color: var(--white-dim); }
  .cms-notice input[type="text"] {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 0.5rem 0.7rem;
    margin-top: 0.5rem;
  }

  .cms-preview-links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; }

  /* ---------- Crop modal ---------- */
  .crop-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .crop-modal {
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    padding: 2rem;
    max-width: 560px;
    width: 100%;
  }
  .crop-modal h3 {
    font-family: var(--font-display);
    color: var(--pure-white);
    font-size: 1.2rem;
    margin-bottom: 0.4rem;
  }
  .crop-modal p.crop-hint { color: var(--grey-muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
  .crop-viewport {
    position: relative;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border-dim);
    margin: 0 auto 1.25rem;
    cursor: grab;
    user-select: none;
  }
  .crop-viewport.dragging { cursor: grabbing; }
  .crop-viewport img { position: absolute; top: 0; left: 0; max-width: none; }
  .crop-zoom-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
  .crop-zoom-row span { font-size: 0.7rem; color: var(--grey-muted); font-family: var(--font-heading); letter-spacing: 0.1rem; }
  .crop-zoom-row input[type="range"] { flex: 1; }
  .crop-modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; }

</style>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div class="login-shell" id="loginShell">
    <div class="login-card">
      <h1>Content Manager</h1>
      <p>Sign in with the admin account created in Supabase to edit TMB Studio's site.</p>
      <div class="login-error" id="loginError"></div>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
      <button class="cms-btn primary" id="loginBtn" style="width: 100%;">Sign In</button>
    </div>
  </div>

  <!-- ============================================================
       CMS APP (shown after successful login)
       ============================================================ -->
  <div class="cms-app" id="cmsApp">
    <div class="cms-sidebar">
      <div class="cms-sidebar-brand">TMB Studio</div>
      <div id="navList"></div>
      <div class="cms-sidebar-footer">
        <div class="cms-user-email" id="userEmail"></div>
        <button class="cms-btn" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <div class="cms-main">
      <div id="pagesEl"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG — fill in once your Cloudflare Worker is deployed.
       Also editable live below (saved to this browser only).
       ============================================================ */
    const SUPABASE_URL = "https://rmfyfinfiujiqwljuxld.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZnlmaW5maXVqaXF3bGp1eGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTcwMTgsImV4cCI6MjEwMjMzMzAxOH0.aJVN9JwpiJLA1Q-x_r9hfmAl7KRwTv97MHsJuWh-td8";
    const DEFAULT_R2_PUBLIC_URL = "https://pub-f1f78e5c68c242538bedd84c6ee971df.r2.dev";

    const CMS_KEY = "tmb_cms_content";
    const WORKER_URL_KEY = "tmb_cms_worker_url";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getWorkerUrl() {
      return (localStorage.getItem(WORKER_URL_KEY) || "").trim().replace(/\/$/, "");
    }
    function setWorkerUrl(v) {
      localStorage.setItem(WORKER_URL_KEY, v.trim().replace(/\/$/, ""));
    }

    /* ============================================================
       SCHEMA — grouped into pages so the sidebar can render each
       as its own "screen" rather than a flat list of everything.
       ============================================================ */
    const PAGES = [
      {
        id: "connections", label: "Connections",
        kind: "connections",
      },
      {
        id: "home", label: "Home",
        kind: "fields",
        description: "The hero video and the Who We Are section on the home page. Project cards are managed on the Projects page now.",
        fields: [
          { path: "home.heroTagline", label: "Hero tagline (below the looping video)", type: "textarea" },
          { path: "home.aboutTitle", label: "Who We Are — heading", type: "text" },
          { path: "home.aboutParagraphs.0", label: "Who We Are — paragraph 1", type: "textarea" },
          { path: "home.aboutParagraphs.1", label: "Who We Are — paragraph 2", type: "textarea" },
          { path: "home.aboutParagraphs.2", label: "Who We Are — paragraph 3", type: "textarea" },
        ]
      },
      {
        id: "projects", label: "Projects",
        kind: "projects",
      },
      {
        id: "team", label: "Team",
        kind: "team",
      },
    ];

    let content = {};
    let session = null;
    let saveTimer = null;

    function getPath(obj, path) {
      return path.split(".").reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), obj);
    }
    function setPath(obj, path, value) {
      const keys = path.split(".");
      let cur = obj;
      for (let i = 0; i < keys.length - 1; i++) {
        const k = keys[i];
        const nextIsIndex = /^\d+$/.test(keys[i + 1]);
        if (cur[k] === undefined || cur[k] === null) cur[k] = nextIsIndex ? [] : {};
        cur = cur[k];
      }
      cur[keys[keys.length - 1]] = value;
    }

    async function loadContent() {
      let base = {};
      try {
        const res = await fetch("./content.json", { cache: "no-store" });
        if (res.ok) base = await res.json();
      } catch (e) { console.warn("Could not load content.json", e); }
      try {
        const raw = localStorage.getItem(CMS_KEY);
        if (raw) base = JSON.parse(raw);
      } catch (e) {}
      content = base;
    }

    function saveLocalPreview() {
      localStorage.setItem(CMS_KEY, JSON.stringify(content));
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      setStatus(`Saved to this browser · ${timeStr}`, "saved");
    }

    function markUnsaved() {
      setStatus("Unsaved changes — saving…", "");
    }

    function setStatus(msg, cls) {
      const statusEl = document.getElementById("statusEl");
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = "cms-status" + (cls ? " " + cls : "");
    }

    function flashStatus(msg, cls) {
      // Kept for error messages that should stand out but not persist forever.
      setStatus(msg, cls);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveLocalPreview(), 2600);
    }

    /* ============================================================
       CLOUDFLARE WORKER — upload / delete
       ============================================================ */
    async function uploadToWorker(file) {
      const workerUrl = getWorkerUrl();
      if (!workerUrl) throw new Error("Set your Cloudflare Worker URL on the Connections page first.");
      const form = new FormData();
      form.append("file", file);
      const res = await fetch(`${workerUrl}/upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${session.access_token}` },
        body: form,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Upload failed (${res.status})`);
      }
      return res.json(); // { url, key }
    }

    async function deleteFromWorker(key) {
      const workerUrl = getWorkerUrl();
      if (!workerUrl || !key) return;
      const res = await fetch(`${workerUrl}/delete`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ key }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Delete failed (${res.status})`);
      }
    }

    /* ============================================================
       CROP MODAL — lets the person pan/zoom an uploaded image inside
       a fixed-ratio window, then exports exactly that crop as a new
       file at a consistent resolution. Used for every image upload
       so media stays a uniform ratio across the site.
       ============================================================ */
    function openCropModal(file, { ratioW = 16, ratioH = 9, outW = 1920, outH = 1080 } = {}) {
      return new Promise((resolve) => {
        const VIEW_W = 480;
        const VIEW_H = Math.round((VIEW_W * ratioH) / ratioW);

        const overlay = document.createElement("div");
        overlay.className = "crop-overlay";
        overlay.innerHTML = `
          <div class="crop-modal">
            <h3>Crop image (${ratioW}:${ratioH})</h3>
            <p class="crop-hint">Drag to reposition, use the slider to zoom. Everything inside the frame is what gets used.</p>
            <div class="crop-viewport" id="cropViewport" style="width:${VIEW_W}px; height:${VIEW_H}px;">
              <img id="cropImg" draggable="false" />
            </div>
            <div class="crop-zoom-row">
              <span>ZOOM</span>
              <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" />
            </div>
            <div class="crop-modal-actions">
              <button class="cms-btn" id="cropCancel">Cancel</button>
              <button class="cms-btn primary" id="cropConfirm">Use This Crop</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const viewport = overlay.querySelector("#cropViewport");
        const imgEl = overlay.querySelector("#cropImg");
        const zoomSlider = overlay.querySelector("#cropZoom");

        let naturalW = 0, naturalH = 0, baseScale = 1, scale = 1, offsetX = 0, offsetY = 0;
        let dragging = false, dragStartX = 0, dragStartY = 0, startOffsetX = 0, startOffsetY = 0;

        const objectUrl = URL.createObjectURL(file);
        imgEl.src = objectUrl;

        function updateTransform() {
          const w = naturalW * baseScale * scale;
          const h = naturalH * baseScale * scale;
          imgEl.style.width = w + "px";
          imgEl.style.height = h + "px";
          const minX = VIEW_W - w, minY = VIEW_H - h;
          offsetX = Math.min(0, Math.max(minX, offsetX));
          offsetY = Math.min(0, Math.max(minY, offsetY));
          imgEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }

        imgEl.onload = () => {
          naturalW = imgEl.naturalWidth;
          naturalH = imgEl.naturalHeight;
          baseScale = Math.max(VIEW_W / naturalW, VIEW_H / naturalH);
          offsetX = (VIEW_W - naturalW * baseScale) / 2;
          offsetY = (VIEW_H - naturalH * baseScale) / 2;
          updateTransform();
        };

        zoomSlider.addEventListener("input", () => {
          scale = parseFloat(zoomSlider.value);
          updateTransform();
        });

        viewport.addEventListener("mousedown", (e) => {
          dragging = true;
          viewport.classList.add("dragging");
          dragStartX = e.clientX; dragStartY = e.clientY;
          startOffsetX = offsetX; startOffsetY = offsetY;
        });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          offsetX = startOffsetX + (e.clientX - dragStartX);
          offsetY = startOffsetY + (e.clientY - dragStartY);
          updateTransform();
        });
        window.addEventListener("mouseup", () => {
          dragging = false;
          viewport.classList.remove("dragging");
        });

        function cleanup() {
          URL.revokeObjectURL(objectUrl);
          overlay.remove();
        }

        overlay.querySelector("#cropCancel").addEventListener("click", () => {
          cleanup();
          resolve(null);
        });

        overlay.querySelector("#cropConfirm").addEventListener("click", () => {
          const totalScale = baseScale * scale;
          const srcX = -offsetX / totalScale;
          const srcY = -offsetY / totalScale;
          const srcW = VIEW_W / totalScale;
          const srcH = VIEW_H / totalScale;

          const canvas = document.createElement("canvas");
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(imgEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
          canvas.toBlob((blob) => {
            cleanup();
            const name = (file.name || "image").replace(/\.[^.]+$/, "") + "-cropped.jpg";
            resolve(new File([blob], name, { type: "image/jpeg" }));
          }, "image/jpeg", 0.9);
        });
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    /* ============================================================
       RENDERING
       ============================================================ */
    function renderSidebar() {
      const navList = document.getElementById("navList");
      navList.innerHTML = "";
      PAGES.forEach((page, i) => {
        const btn = document.createElement("button");
        btn.className = "cms-nav-item" + (i === 0 ? " active" : "");
        btn.textContent = page.label;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".cms-nav-item").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".cms-page").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("page-" + page.id).classList.add("active");
        });
        navList.appendChild(btn);
      });
    }

    function renderTextField(field) {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = field.label;
      wrap.appendChild(label);

      const currentVal = getPath(content, field.path) || "";
      const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
      if (field.type === "text") input.type = "text";
      input.value = currentVal;
      input.addEventListener("input", () => {
        setPath(content, field.path, input.value);
        saveLocalPreview();
      });
      wrap.appendChild(input);
      return wrap;
    }

    function renderSimpleMediaField(field) {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = field.label;
      wrap.appendChild(label);

      const currentVal = getPath(content, field.path) || "";
      const row = document.createElement("div");
      row.className = "cms-media-row";

      const preview = document.createElement("div");
      preview.className = "cms-preview";

    // The Home background video: real Upload / Change / Delete against
    // the Cloudflare bucket, not just a pasted path.
    // The Who We Are carousel images: a variable-length list, each
    // backed by the Cloudflare bucket, with crop-to-16:9 on upload.
    function renderAboutImagesField() {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = "Who We Are — carousel images";
      wrap.appendChild(label);

      if (!content.home) content.home = {};
      if (!Array.isArray(content.home.aboutImages)) content.home.aboutImages = [];
      // Migrate any legacy plain-string entries to {url, key} objects.
      content.home.aboutImages = content.home.aboutImages.map(img =>
        typeof img === "string" ? { url: img, key: "" } : img
      );

      content.home.aboutImages.forEach((img, i) => {
        const row = document.createElement("div");
        row.className = "cms-media-row";

        const preview = document.createElement("div");
        preview.className = "cms-preview";
        const imgEl = document.createElement("img");
        imgEl.src = img.url;
        preview.appendChild(imgEl);
        row.appendChild(preview);

        const controls = document.createElement("div");
        controls.className = "cms-media-controls";
        const hint = document.createElement("div");
        hint.className = "cms-hint";
        hint.textContent = img.key ? "Stored in your Cloudflare bucket." : "Not yet uploaded through the CMS.";

        const btnRow = document.createElement("div");
        btnRow.className = "cms-media-btn-row";

        const changeLbl = document.createElement("label");
        changeLbl.className = "cms-upload-label";
        changeLbl.textContent = "Change";
        const changeInp = document.createElement("input");
        changeInp.type = "file";
        changeInp.accept = "image/*";
        changeInp.style.display = "none";
        changeInp.addEventListener("change", async () => {
          const file = changeInp.files[0];
          if (!file) return;
          const cropped = await openCropModal(file, { ratioW: 16, ratioH: 9, outW: 1920, outH: 1080 });
          if (!cropped) return;
          hint.textContent = "Uploading…";
          try {
            const oldKey = img.key;
            const result = await uploadToWorker(cropped);
            if (oldKey) await deleteFromWorker(oldKey).catch((e) => console.warn(e));
            content.home.aboutImages[i] = { url: result.url, key: result.key };
            saveLocalPreview();
            renderPages();
          } catch (e) {
            hint.textContent = e.message || "Upload failed.";
            hint.className = "cms-hint error";
          }
        });
        changeLbl.appendChild(changeInp);
        btnRow.appendChild(changeLbl);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "cms-upload-label danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Remove this image from the carousel? If it's in your bucket, it'll be deleted there too.")) return;
          try {
            if (img.key) await deleteFromWorker(img.key);
            content.home.aboutImages.splice(i, 1);
            saveLocalPreview();
            renderPages();
          } catch (e) {
            hint.textContent = e.message || "Delete failed.";
            hint.className = "cms-hint error";
          }
        });
        btnRow.appendChild(deleteBtn);

        controls.appendChild(btnRow);
        controls.appendChild(hint);
        row.appendChild(controls);
        wrap.appendChild(row);
      });

      const addLbl = document.createElement("label");
      addLbl.className = "cms-upload-label";
      addLbl.textContent = "+ Add image";
      const addInp = document.createElement("input");
      addInp.type = "file";
      addInp.accept = "image/*";
      addInp.style.display = "none";
      addInp.addEventListener("change", async () => {
        const file = addInp.files[0];
        if (!file) return;
        const cropped = await openCropModal(file, { ratioW: 16, ratioH: 9, outW: 1920, outH: 1080 });
        if (!cropped) return;
        try {
          const result = await uploadToWorker(cropped);
          content.home.aboutImages.push({ url: result.url, key: result.key });
          saveLocalPreview();
          renderPages();
        } catch (e) {
          alert("Upload failed: " + e.message);
        }
      });
      addLbl.appendChild(addInp);
      wrap.appendChild(addLbl);

      const overallHint = document.createElement("div");
      overallHint.className = "cms-hint";
      overallHint.style.marginTop = "0.75rem";
      overallHint.textContent = "Every image is cropped to a consistent 16:9 frame on upload so the carousel never looks mismatched.";
      wrap.appendChild(overallHint);

      return wrap;
    }

    function renderManagedVideoField() {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";

      wrap.appendChild(label);

      const row = document.createElement("div");

      preview.className = "cms-preview" + (currentUrl ? "" : " empty");

      videoEl.muted = true;
      videoEl.controls = true;

        preview.textContent = "No video set";

      controls.className = "cms-media-controls";

      const hint = document.createElement("div");
      hint.className = "cms-hint";
      hint.textContent = currentUrl

        : "Nothing uploaded yet — click Upload to add one.";

      const btnRow = document.createElement("div");
      btnRow.className = "cms-media-btn-row";

      function makeFileTrigger(labelText, danger) {
        const lbl = document.createElement("label");
        lbl.className = "cms-upload-label" + (danger ? " danger" : "");
        lbl.textContent = labelText;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "video/*";
        input.style.display = "none";
        lbl.appendChild(input);
        return { lbl, input };

      async function handleUploadOrChange(file, isChange) {
        hint.textContent = "Uploading…";
        hint.className = "cms-hint";
        try {
          const oldKey = getPath(content, "home.heroVideoKey");
          const result = await uploadToWorker(file);
          if (isChange && oldKey) {
            await deleteFromWorker(oldKey).catch((e) => console.warn("Old video cleanup failed:", e));
          }
          setPath(content, "home.heroVideo", result.url);
          setPath(content, "home.heroVideoKey", result.key);
          saveLocalPreview();
          renderPages(); // re-render this page so preview/buttons update
        } catch (e) {
          hint.textContent = e.message || "Upload failed.";
          hint.className = "cms-hint error";
        }
      }

      if (!currentUrl) {
        const { lbl, input } = makeFileTrigger("Upload video");
        input.addEventListener("change", () => {
          if (input.files[0]) handleUploadOrChange(input.files[0], false);
        });
        btnRow.appendChild(lbl);
      } else {
        const { lbl: changeLbl, input: changeInput } = makeFileTrigger("Change video");
        changeInput.addEventListener("change", () => {
          if (changeInput.files[0]) handleUploadOrChange(changeInput.files[0], true);
        });

        deleteBtn.className = "cms-upload-label danger";
        deleteBtn.textContent = "Delete video";

          hint.textContent = "Deleting…";
          try {
            const oldKey = getPath(content, "home.heroVideoKey");
            if (oldKey) await deleteFromWorker(oldKey);
            setPath(content, "home.heroVideo", "");
            setPath(content, "home.heroVideoKey", "");
            saveLocalPreview();
            renderPages();
          } catch (e) {
            hint.textContent = e.message || "Delete failed.";
            hint.className = "cms-hint error";
          }
        });
        btnRow.appendChild(deleteBtn);
      }

      controls.appendChild(btnRow);
      controls.appendChild(hint);
      row.appendChild(controls);
      wrap.appendChild(row);
      return wrap;
    }

    /* ============================================================
       PROJECTS — list + editor, backed directly by Supabase
       (not the content.json/localStorage flow used elsewhere,
       since add/delete needs a real database).
       ============================================================ */
    let projectsViewMode = "list"; // "list" | "edit"
    let editingProject = null;

    function statusBadgeText(status) {
      return { in_development: "In Development", published: "Published", cancelled: "Cancelled" }[status] || status;
    }

    async function fetchAllProjectsAdmin() {
      const { data, error } = await supabaseClient.from("projects").select("*").order("sort_order", { ascending: true });
      if (error) { console.error(error); return []; }
      return data;
    }

    async function renderProjectsPage(pageEl) {
      if (projectsViewMode === "edit" && editingProject) {
        renderProjectEditor(pageEl);
      } else {
        await renderProjectsList(pageEl);
      }
    }

    async function renderProjectsList(pageEl) {
      const addBtn = document.createElement("button");
      addBtn.className = "cms-btn primary";
      addBtn.textContent = "+ Add New Project";
      addBtn.style.marginBottom = "1.5rem";
      addBtn.addEventListener("click", async () => {
        const raw = prompt("Slug for the new project (used in the URL, e.g. \"my-new-game\"):");
        if (!raw) return;
        const slug = raw.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
        if (!slug) { alert("That slug isn't valid — use letters, numbers, and hyphens."); return; }
        const existing = await fetchAllProjectsAdmin();
        const { data, error } = await supabaseClient.from("projects").insert({
          slug,
          title: "New Project",
          sort_order: existing.length,
        }).select().single();
        if (error) { alert("Couldn't create project: " + error.message); return; }
        editingProject = data;
        projectsViewMode = "edit";
        renderPages();
      });
      pageEl.appendChild(addBtn);

      const projects = await fetchAllProjectsAdmin();

      if (!projects.length) {
        const empty = document.createElement("p");
        empty.className = "cms-hint";
        empty.textContent = 'No projects yet — click "+ Add New Project" to create one.';
        pageEl.appendChild(empty);
        return;
      }

      projects.forEach((p) => {
        const row = document.createElement("div");
        row.className = "cms-field";
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.justifyContent = "space-between";
        row.style.gap = "1rem";
        row.style.flexWrap = "wrap";

        const info = document.createElement("div");
        info.innerHTML = `<strong style="color:var(--white-dim); font-family:var(--font-heading); font-size:0.95rem;">${p.title || "(untitled)"}</strong>
          <div class="cms-hint" style="margin-top:0.25rem;">/${p.slug} · ${statusBadgeText(p.status)} · ${p.published ? "Published to site" : "Hidden (unpublished)"}</div>`;
        row.appendChild(info);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "0.5rem";

        const previewBtn = document.createElement("a");
        previewBtn.className = "cms-btn";
        previewBtn.textContent = "Preview";
        previewBtn.href = `./project.html?slug=${encodeURIComponent(p.slug)}`;
        previewBtn.target = "_blank";
        previewBtn.rel = "noopener";
        actions.appendChild(previewBtn);

        const editBtn = document.createElement("button");
        editBtn.className = "cms-btn";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => {
          editingProject = JSON.parse(JSON.stringify(p));
          projectsViewMode = "edit";
          renderPages();
        });
        actions.appendChild(editBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "cms-upload-label danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm(`Delete "${p.title}" permanently? This removes it from the database. Any uploaded media stays in your Cloudflare bucket and needs deleting there separately.`)) return;
          const { error } = await supabaseClient.from("projects").delete().eq("id", p.id);
          if (error) { alert("Delete failed: " + error.message); return; }
          renderPages();
        });
        actions.appendChild(deleteBtn);

        row.appendChild(actions);
        pageEl.appendChild(row);
      });
    }

    function renderManagedMediaEditorField({ label, mediaType, getUrl, getKey, setBoth, crop }) {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const lbl = document.createElement("label");
      lbl.textContent = label;
      wrap.appendChild(lbl);

      const row = document.createElement("div");
      row.className = "cms-media-row";

      const currentUrl = getUrl() || "";
      const preview = document.createElement("div");
      preview.className = "cms-preview" + (currentUrl ? "" : " empty");
      const mediaEl = document.createElement(mediaType === "video" ? "video" : "img");
      if (mediaType === "video") { mediaEl.muted = true; mediaEl.controls = true; }
      if (currentUrl) { mediaEl.src = currentUrl; preview.appendChild(mediaEl); }
      else { preview.textContent = "None set"; }
      row.appendChild(preview);

      const controls = document.createElement("div");
      controls.className = "cms-media-controls";
      const hint = document.createElement("div");
      hint.className = "cms-hint";
      hint.textContent = currentUrl ? "Stored in your Cloudflare bucket." : "Nothing uploaded yet.";

      const btnRow = document.createElement("div");
      btnRow.className = "cms-media-btn-row";

      function makeTrigger(text, danger) {
        const l = document.createElement("label");
        l.className = "cms-upload-label" + (danger ? " danger" : "");
        l.textContent = text;
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = mediaType === "video" ? "video/*" : "image/*";
        inp.style.display = "none";
        l.appendChild(inp);
        return { l, inp };
      }

      async function doUpload(rawFile, isChange) {
        let file = rawFile;
        if (crop && mediaType === "image") {
          const cropped = await openCropModal(rawFile, crop);
          if (!cropped) return; // cancelled
          file = cropped;
        }
        hint.textContent = "Uploading…";
        hint.className = "cms-hint";
        try {
          const oldKey = getKey();
          const result = await uploadToWorker(file);
          if (isChange && oldKey) await deleteFromWorker(oldKey).catch((e) => console.warn(e));
          setBoth(result.url, result.key);
          renderPages();
        } catch (e) {
          hint.textContent = e.message || "Upload failed.";
          hint.className = "cms-hint error";
        }
      }

      if (!currentUrl) {
        const { l, inp } = makeTrigger("Upload " + mediaType);
        inp.addEventListener("change", () => { if (inp.files[0]) doUpload(inp.files[0], false); });
        btnRow.appendChild(l);
      } else {
        const { l: cl, inp: cinp } = makeTrigger("Change " + mediaType);
        cinp.addEventListener("change", () => { if (cinp.files[0]) doUpload(cinp.files[0], true); });
        btnRow.appendChild(cl);

        const delBtn = document.createElement("button");
        delBtn.className = "cms-upload-label danger";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", async () => {
          if (!confirm("Delete this file from the bucket?")) return;
          hint.textContent = "Deleting…";
          try {
            const k = getKey();
            if (k) await deleteFromWorker(k);
            setBoth("", "");
            renderPages();
          } catch (e) {
            hint.textContent = e.message || "Delete failed.";
            hint.className = "cms-hint error";
          }
        });
        btnRow.appendChild(delBtn);
      }

      controls.appendChild(btnRow);
      controls.appendChild(hint);
      row.appendChild(controls);
      wrap.appendChild(row);
      return wrap;
    }

        wrap.appendChild(rowEl);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "cms-upload-label";
      addBtn.textContent = "+ Add row";
      addBtn.addEventListener("click", () => {
        editingProject.scope.push({ label: "", value: "" });
        renderPages();
      });
      wrap.appendChild(addBtn);
      return wrap;
    }

    function renderToolsField() {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const lbl = document.createElement("label");
      lbl.textContent = "Tools & software (one per line)";
      wrap.appendChild(lbl);

      const ta = document.createElement("textarea");
      ta.value = (editingProject.tools || []).join("\n");
      ta.addEventListener("input", () => {
        editingProject.tools = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
      });
      wrap.appendChild(ta);
      return wrap;
    }

    function renderProjectEditor(pageEl) {
      const backBtn = document.createElement("button");
      backBtn.className = "cms-btn";
      backBtn.textContent = "← Back to Projects";
      backBtn.style.marginBottom = "1.5rem";
      backBtn.addEventListener("click", () => {
        projectsViewMode = "list";
        editingProject = null;
        renderPages();
      });
      pageEl.appendChild(backBtn);

      const saveStatus = document.createElement("div");
      saveStatus.className = "cms-hint";
      saveStatus.style.marginBottom = "1rem";
      pageEl.appendChild(saveStatus);

      // Basic text fields
      const basicFields = [
        { key: "title", label: "Title" },
        { key: "tagline", label: "Tagline" },
        { key: "genre", label: "Genre" },
        { key: "platform", label: "Platform" },
        { key: "slug", label: "Slug (URL) — careful changing this, it breaks existing links" },
      ];
      basicFields.forEach(f => {
        const wrap = document.createElement("div");
        wrap.className = "cms-field";
        const lbl = document.createElement("label");
        lbl.textContent = f.label;
        wrap.appendChild(lbl);
        const input = document.createElement("input");
        input.type = "text";
        input.value = editingProject[f.key] || "";
        input.addEventListener("input", () => { editingProject[f.key] = input.value; });
        wrap.appendChild(input);
        pageEl.appendChild(wrap);
      });

      // Status + note
      const statusWrap = document.createElement("div");
      statusWrap.className = "cms-field";
      const statusLbl = document.createElement("label");
      statusLbl.textContent = "Status";
      statusWrap.appendChild(statusLbl);
      const statusSelect = document.createElement("select");
      statusSelect.style.cssText = "width:100%; background:var(--grey-deep); border:1px solid var(--border-dim); color:var(--white-dim); padding:0.65rem 0.85rem; font-family:var(--font-body); font-size:0.95rem; margin-bottom:0.75rem;";
      [["in_development", "In Development"], ["published", "Published"], ["cancelled", "Cancelled"]].forEach(([val, text]) => {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = text;
        if (editingProject.status === val) opt.selected = true;
        statusSelect.appendChild(opt);
      });
      statusSelect.addEventListener("change", () => { editingProject.status = statusSelect.value; });
      statusWrap.appendChild(statusSelect);
      const noteInput = document.createElement("input");
      noteInput.type = "text";
      noteInput.placeholder = "Optional note, e.g. \"Expected Q3 2026\"";
      noteInput.value = editingProject.status_note || "";
      noteInput.addEventListener("input", () => { editingProject.status_note = noteInput.value; });
      statusWrap.appendChild(noteInput);
      pageEl.appendChild(statusWrap);

      // Hero background (managed)
      pageEl.appendChild(renderManagedMediaEditorField({
        label: "Full-screen hero background",
        mediaType: "image",
        getUrl: () => editingProject.hero_background,
        getKey: () => editingProject.hero_background_key,
        setBoth: (url, key) => { editingProject.hero_background = url; editingProject.hero_background_key = key; },
      }));

      // Cover image (managed)
      pageEl.appendChild(renderManagedMediaEditorField({
        label: "Cover image (About section poster)",
        mediaType: "image",
        getUrl: () => editingProject.cover_image,
        getKey: () => editingProject.cover_image_key,
        setBoth: (url, key) => { editingProject.cover_image = url; editingProject.cover_image_key = key; },
      }));

      pageEl.appendChild(renderDescriptionField());
      pageEl.appendChild(renderSupportingImagesField());
      pageEl.appendChild(renderScopeField());
      pageEl.appendChild(renderToolsField());

      // Home card media type + media
      const cardTypeWrap = document.createElement("div");
      cardTypeWrap.className = "cms-field";
      const cardTypeLbl = document.createElement("label");
      cardTypeLbl.textContent = "Home page card — media type";
      cardTypeWrap.appendChild(cardTypeLbl);
      const cardTypeSelect = document.createElement("select");
      cardTypeSelect.style.cssText = "width:100%; background:var(--grey-deep); border:1px solid var(--border-dim); color:var(--white-dim); padding:0.65rem 0.85rem; font-family:var(--font-body); font-size:0.95rem;";
      [["image", "Image"], ["video", "Video"]].forEach(([val, text]) => {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = text;
        if (editingProject.card_media_type === val) opt.selected = true;
        cardTypeSelect.appendChild(opt);
      });
      cardTypeSelect.addEventListener("change", () => {
        editingProject.card_media_type = cardTypeSelect.value;
        renderPages();
      });
      cardTypeWrap.appendChild(cardTypeSelect);
      pageEl.appendChild(cardTypeWrap);

      pageEl.appendChild(renderManagedMediaEditorField({
        label: "Home page card — media file",
        mediaType: editingProject.card_media_type === "video" ? "video" : "image",
        getUrl: () => editingProject.card_media_url,
        getKey: () => editingProject.card_media_key,
        setBoth: (url, key) => { editingProject.card_media_url = url; editingProject.card_media_key = key; },
      }));

      // Sort order + published
      const metaWrap = document.createElement("div");
      metaWrap.className = "cms-field";
      metaWrap.style.display = "flex";
      metaWrap.style.gap = "2rem";
      metaWrap.style.alignItems = "center";

      const sortLbl = document.createElement("label");
      sortLbl.style.marginBottom = "0";
      sortLbl.textContent = "Sort order";
      const sortInput = document.createElement("input");
      sortInput.type = "text";
      sortInput.style.width = "80px";
      sortInput.value = editingProject.sort_order ?? 0;
      sortInput.addEventListener("input", () => {
        const n = parseInt(sortInput.value, 10);
        editingProject.sort_order = isNaN(n) ? 0 : n;
      });
      const sortGroup = document.createElement("div");
      sortGroup.appendChild(sortLbl);
      sortGroup.appendChild(sortInput);

      const pubGroup = document.createElement("label");
      pubGroup.style.display = "flex";
      pubGroup.style.alignItems = "center";
      pubGroup.style.gap = "0.5rem";
      pubGroup.style.marginBottom = "0";
      pubGroup.style.cursor = "pointer";
      const pubCheckbox = document.createElement("input");
      pubCheckbox.type = "checkbox";
      pubCheckbox.checked = !!editingProject.published;
      pubCheckbox.addEventListener("change", () => { editingProject.published = pubCheckbox.checked; });
      pubGroup.appendChild(pubCheckbox);
      pubGroup.appendChild(document.createTextNode("Published (visible on the live site)"));

      metaWrap.appendChild(sortGroup);
      metaWrap.appendChild(pubGroup);
      pageEl.appendChild(metaWrap);

      // Save / Delete
      const actionsRow = document.createElement("div");
      actionsRow.style.display = "flex";
      actionsRow.style.gap = "0.75rem";
      actionsRow.style.marginTop = "1rem";

      const saveBtn = document.createElement("button");
      saveBtn.className = "cms-btn primary";
      saveBtn.textContent = "Save Project";
      saveBtn.addEventListener("click", async () => {
        saveStatus.textContent = "Saving…";
        saveStatus.className = "cms-hint";
        const { id, created_at, updated_at, ...updateFields } = editingProject;
        const { error } = await supabaseClient.from("projects").update(updateFields).eq("id", id);
        if (error) {
          saveStatus.textContent = "Save failed: " + error.message;
          saveStatus.className = "cms-hint error";
        } else {
          saveStatus.textContent = "Saved to the database ✓";
          saveStatus.className = "cms-hint";
          saveStatus.style.color = "#8aff8a";
        }
      });
      actionsRow.appendChild(saveBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "cms-upload-label danger";
      deleteBtn.textContent = "Delete This Project";
      deleteBtn.addEventListener("click", async () => {
        if (!confirm(`Delete "${editingProject.title}" permanently?`)) return;
        const { error } = await supabaseClient.from("projects").delete().eq("id", editingProject.id);
        if (error) { alert("Delete failed: " + error.message); return; }
        projectsViewMode = "list";
        editingProject = null;
        renderPages();
      });
      actionsRow.appendChild(deleteBtn);

      pageEl.appendChild(actionsRow);
    }

    /* ============================================================
       TEAM — list + editor, backed directly by Supabase (same
       pattern as Projects). Capped at 6 members.
       ============================================================ */
    const MAX_TEAM_MEMBERS = 6;
    let teamViewMode = "list"; // "list" | "edit"
    let editingMember = null;

    async function fetchAllTeamAdmin() {
      const { data, error } = await supabaseClient.from("team_members").select("*").order("sort_order", { ascending: true });
      if (error) { console.error(error); return []; }
      return data;
    }

    async function renderTeamPage(pageEl) {
      if (teamViewMode === "edit" && editingMember) {
        renderTeamEditor(pageEl);
      } else {
        await renderTeamList(pageEl);
      }
    }

    async function renderTeamList(pageEl) {
      const members = await fetchAllTeamAdmin();

      const addBtn = document.createElement("button");
      addBtn.className = "cms-btn primary";
      addBtn.textContent = members.length >= MAX_TEAM_MEMBERS ? "Maximum of 6 members reached" : "+ Add Team Member";
      addBtn.disabled = members.length >= MAX_TEAM_MEMBERS;
      addBtn.style.marginBottom = "1.5rem";
      addBtn.addEventListener("click", async () => {
        const { data, error } = await supabaseClient.from("team_members").insert({
          name: "New Member",
          role: "",
          sort_order: members.length,
        }).select().single();
        if (error) { alert("Couldn't add member: " + error.message); return; }
        editingMember = data;
        teamViewMode = "edit";
        renderPages();
      });
      pageEl.appendChild(addBtn);

      if (!members.length) {
        const empty = document.createElement("p");
        empty.className = "cms-hint";
        empty.textContent = 'No team members yet — click "+ Add Team Member" to create one.';
        pageEl.appendChild(empty);
        return;
      }

      members.forEach((m) => {
        const row = document.createElement("div");
        row.className = "cms-field";
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.justifyContent = "space-between";
        row.style.gap = "1rem";
        row.style.flexWrap = "wrap";

        const info = document.createElement("div");
        info.style.display = "flex";
        info.style.alignItems = "center";
        info.style.gap = "1rem";
        const thumb = document.createElement("div");
        thumb.style.cssText = "width:48px; height:48px; border-radius:50%; overflow:hidden; background:var(--grey-mid); flex-shrink:0;";
        if (m.photo_url) {
          const img = document.createElement("img");
          img.src = m.photo_url;
          img.style.cssText = "width:100%; height:100%; object-fit:cover;";
          thumb.appendChild(img);
        }
        const text = document.createElement("div");
        text.innerHTML = `<strong style="color:var(--white-dim); font-family:var(--font-heading); font-size:0.9rem;">${m.name || "(unnamed)"}</strong>
          <div class="cms-hint" style="margin-top:0.2rem;">${(m.role || "").replace(/<br\s*\/?>/gi, " · ")}</div>`;
        info.appendChild(thumb);
        info.appendChild(text);
        row.appendChild(info);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "0.5rem";

        const editBtn = document.createElement("button");
        editBtn.className = "cms-btn";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => {
          editingMember = JSON.parse(JSON.stringify(m));
          teamViewMode = "edit";
          renderPages();
        });
        actions.appendChild(editBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "cms-upload-label danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm(`Remove "${m.name}" from the team?`)) return;
          try {
            if (m.photo_key) await deleteFromWorker(m.photo_key).catch((e) => console.warn(e));
          } catch (e) {}
          const { error } = await supabaseClient.from("team_members").delete().eq("id", m.id);
          if (error) { alert("Delete failed: " + error.message); return; }
          renderPages();
        });
        actions.appendChild(deleteBtn);

        row.appendChild(actions);
        pageEl.appendChild(row);
      });
    }

    function renderTeamEditor(pageEl) {
      const backBtn = document.createElement("button");
      backBtn.className = "cms-btn";
      backBtn.textContent = "← Back to Team";
      backBtn.style.marginBottom = "1.5rem";
      backBtn.addEventListener("click", () => {
        teamViewMode = "list";
        editingMember = null;
        renderPages();
      });
      pageEl.appendChild(backBtn);

      const saveStatus = document.createElement("div");
      saveStatus.className = "cms-hint";
      saveStatus.style.marginBottom = "1rem";
      pageEl.appendChild(saveStatus);

      // Photo (managed, square crop to match the circular avatar)
      pageEl.appendChild(renderManagedMediaEditorField({
        label: "Profile photo",
        mediaType: "image",
        crop: { ratioW: 1, ratioH: 1, outW: 800, outH: 800 },
        getUrl: () => editingMember.photo_url,
        getKey: () => editingMember.photo_key,
        setBoth: (url, key) => { editingMember.photo_url = url; editingMember.photo_key = key; },
      }));

      const nameWrap = document.createElement("div");
      nameWrap.className = "cms-field";
      const nameLbl = document.createElement("label");
      nameLbl.textContent = "Name";
      nameWrap.appendChild(nameLbl);
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = editingMember.name || "";
      nameInput.addEventListener("input", () => { editingMember.name = nameInput.value; });
      nameWrap.appendChild(nameInput);
      pageEl.appendChild(nameWrap);

      const roleWrap = document.createElement("div");
      roleWrap.className = "cms-field";
      const roleLbl = document.createElement("label");
      roleLbl.textContent = "Role(s) — one per line";
      roleWrap.appendChild(roleLbl);
      const roleTa = document.createElement("textarea");
      roleTa.value = (editingMember.role || "").split(/<br\s*\/?>/i).join("\n");
      roleTa.addEventListener("input", () => {
        editingMember.role = roleTa.value.split("\n").map(s => s.trim()).filter(Boolean).join("<br>");
      });
      roleWrap.appendChild(roleTa);
      pageEl.appendChild(roleWrap);

      const sortWrap = document.createElement("div");
      sortWrap.className = "cms-field";
      const sortLbl = document.createElement("label");
      sortLbl.textContent = "Sort order";
      sortWrap.appendChild(sortLbl);
      const sortInput = document.createElement("input");
      sortInput.type = "text";
      sortInput.style.width = "80px";
      sortInput.value = editingMember.sort_order ?? 0;
      sortInput.addEventListener("input", () => {
        const n = parseInt(sortInput.value, 10);
        editingMember.sort_order = isNaN(n) ? 0 : n;
      });
      sortWrap.appendChild(sortInput);
      pageEl.appendChild(sortWrap);

      const actionsRow = document.createElement("div");
      actionsRow.style.display = "flex";
      actionsRow.style.gap = "0.75rem";
      actionsRow.style.marginTop = "1rem";

      const saveBtn = document.createElement("button");
      saveBtn.className = "cms-btn primary";
      saveBtn.textContent = "Save Member";
      saveBtn.addEventListener("click", async () => {
        saveStatus.textContent = "Saving…";
        saveStatus.className = "cms-hint";
        const { id, created_at, updated_at, ...updateFields } = editingMember;
        const { error } = await supabaseClient.from("team_members").update(updateFields).eq("id", id);
        if (error) {
          saveStatus.textContent = "Save failed: " + error.message;
          saveStatus.className = "cms-hint error";
        } else {
          saveStatus.textContent = "Saved to the database ✓";
          saveStatus.style.color = "#8aff8a";
        }
      });
      actionsRow.appendChild(saveBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "cms-upload-label danger";
      deleteBtn.textContent = "Delete This Member";
      deleteBtn.addEventListener("click", async () => {
        if (!confirm(`Remove "${editingMember.name}" from the team?`)) return;
        if (editingMember.photo_key) await deleteFromWorker(editingMember.photo_key).catch((e) => console.warn(e));
        const { error } = await supabaseClient.from("team_members").delete().eq("id", editingMember.id);
        if (error) { alert("Delete failed: " + error.message); return; }
        teamViewMode = "list";
        editingMember = null;
        renderPages();
      });
      actionsRow.appendChild(deleteBtn);

      pageEl.appendChild(actionsRow);
    }

    function renderPages() {
      const pagesEl = document.getElementById("pagesEl");
      const activeIdBefore = document.querySelector(".cms-page.active")?.id?.replace("page-", "") || PAGES[0].id;
      pagesEl.innerHTML = "";

      const toolbar = document.createElement("div");
      toolbar.className = "cms-toolbar";
      toolbar.innerHTML = `
        <span class="cms-status saved" id="statusEl">All changes saved to this browser</span>
        <div class="cms-toolbar-actions">
          <button class="cms-btn" id="saveNowBtn">Save Now</button>
          <button class="cms-btn" id="resetBtn">Discard preview</button>
          <button class="cms-btn primary" id="exportBtn">Download content.json</button>
        </div>
      `;
      pagesEl.appendChild(toolbar);

      PAGES.forEach((page) => {
        const pageEl = document.createElement("div");
        pageEl.className = "cms-page" + (page.id === activeIdBefore ? " active" : "");
        pageEl.id = "page-" + page.id;

        if (page.kind === "connections") {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>Connections</h1><p>Backend wiring for the CMS itself.</p>`;
          pageEl.appendChild(header);
          pageEl.appendChild(renderConnectionsPage());
        } else if (page.kind === "projects") {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>Projects</h1><p>Add, edit, or remove projects — changes save straight to your database.</p>`;
          pageEl.appendChild(header);
          renderProjectsPage(pageEl); // async; renders once data arrives
        } else if (page.kind === "team") {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>Team</h1><p>Add, edit, or remove team members (up to 6) — changes save straight to your database.</p>`;
          pageEl.appendChild(header);
          renderTeamPage(pageEl); // async; renders once data arrives
        } else {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>${page.label}</h1><p>${page.description || ""}</p>`;
          pageEl.appendChild(header);

          if (page.id === "home") {
            pageEl.appendChild(renderManagedVideoField());
          }
          page.fields.forEach(field => {
            const el = (field.type === "image" || field.type === "video")
              ? renderSimpleMediaField(field)
              : renderTextField(field);
            pageEl.appendChild(el);
          });
          if (page.id === "home") {
            pageEl.appendChild(renderAboutImagesField());
          }
        }

        pagesEl.appendChild(pageEl);
      });

      document.getElementById("saveNowBtn").addEventListener("click", () => {
        saveLocalPreview();
      });
      document.getElementById("exportBtn").addEventListener("click", downloadContentJson);
      document.getElementById("resetBtn").addEventListener("click", async () => {
        if (!confirm("Discard all local preview edits and reload from the published content.json?")) return;
        localStorage.removeItem(CMS_KEY);
        await loadContent();
        renderPages();
        flashStatus("Local preview discarded");
      });
    }

    function downloadContentJson() {
      const blob = new Blob([JSON.stringify(content, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "content.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /* ============================================================
       AUTH
       ============================================================ */
    async function bootCms() {
      document.getElementById("loginShell").style.display = "none";
      document.getElementById("cmsApp").classList.add("ready");
      document.getElementById("userEmail").textContent = session.user.email;
      await loadContent();
      renderSidebar();
      renderPages();
    }

    async function init() {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        session = data.session;
        await bootCms();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }
      session = data.session;
      await bootCms();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      session = null;
      document.getElementById("cmsApp").classList.remove("ready");
      document.getElementById("loginShell").style.display = "flex";
    });

    init();
  </script>
</body>
</html>
